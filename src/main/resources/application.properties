spring.application.name=itchecksout
server.port=8080
ollama.base-url=http://127.0.0.1:11434
ollama.model=gemma3:12b

# MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/sklad_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 (local development)
spring.datasource.url=jdbc:h2:file:./data/sklad_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

vaadin.productionMode=true
vaadin.launch-browser=false
vaadin.allowed-packages=ru.sklad.app,com.vaadin,org.vaadin,com.storedobject
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.storedobject
# Development: PWA/@PWA is disabled; no service worker registration is injected.

# Telegram notifications (leave empty to disable)
telegram.bot.token=
telegram.chat.id=

# Backup runs at 02:00 in the JVM/server time zone. Optionally specify e.g. Asia/Yekaterinburg.
backup.zone=

# Demo catalog import is recorded in demo_data_runs and never repeated after completion.
# Pass --app.demo-data.reset=true once to explicitly replace existing product/sales data.
app.demo-data.reset=false
app.demo-data.generate=false

app.demo-data.enabled=false
logging.file.name=./logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true

# Demo access is opt-in; never enable it in production.
app.demo-login.enabled=false
# Website backend must supply X-Site-Order-Key. Empty key disables the integration.
app.site-order.api-key=${SITE_ORDER_API_KEY:}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# A shared Telegram destination may receive events from this shop only (0 disables routing).
app.telegram.shop-id=0
