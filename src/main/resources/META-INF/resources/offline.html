<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e7d32">
  <title>Всё сходится! — нет соединения</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center;
      background: #f4f6f8; color: #24332a; font: 16px/1.6 'Segoe UI', sans-serif; }
    main { max-width: 440px; padding: 32px; border-radius: 16px; background: white;
      box-shadow: 0 4px 12px rgb(0 0 0 / 5%); }
    h1 { color: #2e7d32; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; background: #2e7d32;
      color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body><main>
  <h1>Всё сходится!</h1>
  <h2>Нет соединения</h2>
  <p>Для работы со складом требуется подключение к серверу. Проверьте сеть и попробуйте снова.</p>
  <button type="button" onclick="window.location.reload()">Повторить</button>
</main></body>
</html>
